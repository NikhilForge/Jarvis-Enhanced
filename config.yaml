audio:
  frame_ms: 20
  input_device: Airdopes
  input_gain: 3.0
  sample_rate: 16000
  silence_ms_to_endpoint: 850
  vad_aggressiveness: 2
  vad_threshold: 0.20
audit:
  enabled: true
  max_api_records: 500
  path: data/audit.jsonl
compute:
  cpu:
  - silero_vad
  - wakeword_cnn
  - kokoro_tts
  - speaker_encoder
  - browser
  gpu:
  - faster_whisper_int8
  reserved_vram_gb: 1.5
learning:
  dpo_path: data/live_dpo.jsonl
  enabled: true
  min_pairs_before_retrain: 200
  sft_path: data/live_sft.jsonl
llm:
  api_key_env: GEMINI_API_KEY
  backend: gemini
  max_output_tokens: 1024
  model: gemini-flash-lite-latest
  temperature: 0.4
  timeout_seconds: 90
memory:
  archival_top_k: 4
  core_blocks_path: data/core_memory.json
  db_path: data/chroma
  recall_path: data/recall.sqlite3
metrics:
  log_path: data/metrics.jsonl
  sample_seconds: 5
  vram_ceiling_gb: 6.0
proactive:
  enabled: true
  jobs_path: data/jobs.json
  routines:
    08:15: Morning. Say 'jarvis, brief me' whenever you're ready for the day's rundown.
    '23:30': "It's half eleven \u2014 want me to shut the machine down?"
rag:
  embed_model: all-MiniLM-L6-v2
  enabled: true
  index_on_start: false
  max_file_mb: 2
  roots:
  - '%USERPROFILE%/Documents'
  - '%USERPROFILE%/Desktop'
  top_k: 5
safety:
  confirm_before:
  - system.power
  - system.kill
  - fs.delete
  - desktop.run_command
  - homeassistant.call_service
  owner_only:
  - system.power
  - system.kill
  - files.move
  - files.find
  - files.open
  - files.recent
  - fs.list
  - fs.read
  - fs.write
  - desktop.run_command
  - desktop.type_text
  - desktop.hotkey
  - desktop.click
  - desktop.screenshot
  - memory.core_replace
  - memory.core_append
  - memory.archival_search
  - memory.recall_search
  - browser.run_js
server:
  host: 127.0.0.1
  port: 8765
speaker_id:
  enabled: false
  enroll_clips: 8
  owner_name: operator
  privileged_threshold: 0.55
  threshold: 0.3
  voiceprint_path: data/voiceprint.json
stt:
  compute_type: int8
  device: cpu
  engine: faster-whisper
  first_partial_routing: true
  language: en
  model: base.en
  beam_size: 3
tools:
  browser:
    channel: null
    enabled: true
    headless: false
    timeout_ms: 15000
  desktop_automation: true
  filesystem: true
  home_assistant:
    base_url: http://homeassistant.local:8123
    enabled: false
    token_env: HA_TOKEN
  snapcast:
    enabled: false
    host: 127.0.0.1
  vision:
    enabled: true
    model: gemini-flash-lite-latest
    screenshot_path: data/screen.png
  web_search: true
tts:
  engine: sapi
  model_path: models/kokoro-v1.0.onnx
  rate: 190
  sentence_streaming: true
  speed: 1.05
  voice: david
  voices_path: models/voices-v1.0.bin
  output_device: default
wakeword:
  always_on: true
  clap_cooldown_ms: 1200
  clap_max_gap_ms: 700
  clap_min_gap_ms: 120
  clap_to_wake: true
  custom_model_path: null
  enabled: true
  follow_up_seconds: 8
  manual_button: true
  model: hey_jarvis
  threshold: 0.28
  vad_gate: 0.08
